name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One draft release is created up front so the matrix jobs only upload to
  # it (five jobs racing to create it hit GitHub's eventual consistency and
  # one can end up on an orphaned duplicate). It is published by the final
  # job once every asset is in place: the extension resolves "the release
  # for this tag" and must never see one that is missing its platform's
  # binary.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the server crate version
        run: |
          crate=$(grep -m1 '^version' server/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          test "${{ github.ref_name }}" = "v$crate" || { echo "tag ${{ github.ref_name }} does not match server/Cargo.toml version $crate"; exit 1; }
      - name: Ensure a draft release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes "" \
              --draft
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd server/target/${{ matrix.target }}/release
          tar -czf "$GITHUB_WORKSPACE/renpy-language-server-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" renpy-language-server
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "server/target/${{ matrix.target }}/release/renpy-language-server.exe" -DestinationPath "renpy-language-server-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            renpy-language-server-${{ github.ref_name }}-${{ matrix.target }}.* \
            --repo "${{ github.repository }}" --clobber

  # Only reached when every platform built and uploaded.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
