name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2
      - name: Clippy
        run: |
          cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
          cargo clippy --release --target wasm32-wasip2 -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path server/Cargo.toml
      - name: Build server (release)
        run: cargo build --release --manifest-path server/Cargo.toml
      - name: End-to-end LSP protocol test
        run: python3 tests/e2e_lsp.py
      - name: End-to-end DAP protocol test
        run: python3 tests/e2e_dap.py
      - name: End-to-end breakpoint test (skips without a Ren'Py SDK)
        run: python3 tests/e2e_debug_real.py
      - name: Extension glue compiles for wasm32-wasip2
        run: cargo build --release --target wasm32-wasip2
